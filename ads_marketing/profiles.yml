ads_marketing:
  target: "{{ env_var('DBT_TARGET', 'dev') }}"

  meta:
    base: &base
      type: databricks
      threads: 8
    base_auth: &base_auth
      type: databricks
      auth_type: oauth
      client_id: "{{ env_var('DBX_ID_APPLICATION_ID') }}"
      client_secret: "{{ env_var(DBX_SCRET') }}"
      threads: 8
      connect_retries: 30
      retry_all: true


  outputs:
    dev: &dev_service_account
      <<: *base
      host: dbc-c627d95b-5077.cloud.databricks.com
      token: "{{ env_var('DATABRICKS_PAT_TOKEN') }}"
      http_path: /sql/1.0/warehouses/d3ba9200988ea21b
      catalog: "{{ env_var('DEV_CATALOG') }}"
      schema: "{{ env_var('DEV_SCHEMA') }}"

    ci: &ci_service_account
      <<: *base_auth
      catalog: 
      schema: "{{ env_var('DEV_SCHEMA') }}"
      host: 
      http_path: 
  
    staging: &staging_service_account
      <<: *ci_service_account
      catalog: 
      schema: 
      http_path: 

    production: &production_service_account
      <<: *base_auth
      catalog: 
      schema: 
      host: 
      http_path: 

## DATABRICKS ##
## By default, edr expects the profile name 'elementary'.      ##
## Configure the database and schema of elementary models.     ##
## Check where 'elementary_test_results' is to find it.        ##

  elementary:
    target: "{{ env_var('DBT_TARGET', 'dev') }}"
    outputs:
      dev: 
        <<: *dev_service_account
    
      staging:
        <<: *staging_service_account
        schema: elementary

      production: 
        <<: *production_service_account
        catalog: 
        schema: elementary