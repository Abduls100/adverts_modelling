sources:
  - name: facebook_ads
    database: ads_bronze_production
    schema: ads_staging
    description: data from facebook platform (static)
    config:
      enabled: true
      meta:
        owner: "@Data_Team"
        freshness:
          warn_after:
          count: 2
          period: day
      
    tables:
      - name: campaigns
        description: campaign data from facebook platform (static)
        identifier: campaign
        config:
          enabled: true
          event_time: campaign_updated_at

      - name: adgroups
        description: adgroup data from facebook platform (static)
        identifier: adgroup
        config:
          enabled: true
          event_time: adgroup_updated_at

      - name: ads
        description: ads data from facebook platform (static)
        identifier: ads
        config:
          enabled: true
          event_time: ad_updated_at

      - name: ads_stats
        description: ads stats data from facebook platform (static)
        identifier: ads_stats
        config:
          enabled: true
          event_time: stats_updated_at

      - name: accounts
        description: accounts data from facebook platform (static)
        identifier: accounts
        config:
          enabled: true
          event_time: account_updated_at

