sources: 
- name: snapchat_ads
  database: "{{ env_var('DATABRICKS_CATALOG') }}"
  schema: ads_staging
  description: data from snapchat platform (static)
  config:
    enabled: true
    meta:
      owner: "@Data_Team"
    freshness:
      warn_after:
        count: 2
        period: day

  tables:
    - name: ads_history
      description: ads history data from snapchat platform (static)
      indentifier: raw_snapchat_ads_history
      config:
        enabled: true
        event_time: ad_updated_at
        
    - name: ads_stats
      description: ads stats data from snapchat platform (static)
      indentifier: raw_snapchat_ads_stats
      config:
        enabled: true
        event_time: stats_updated_at

    - name: campaigns_history
      description: campaigns history data from snapchat platform (static)
      indentifier: raw_snapchat_ads_campaign_history
      config:
        enabled: true
        event_time: campaign_updated_at
    
    - name: adgroups_history
      description: adgroups history data from snapchat platform (static)
      indentifier: raw_snapchat_ads_adgroup_history
      config:
        enabled: true
        event_time: adgroup_updated_at